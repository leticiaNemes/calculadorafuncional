<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="card">
        <div id="titulo">
            <h1>Minha Calculadora</h1>
        </div>
        <div id="input">
            <input type="number" placeholder="Primeiro Numero" id="numero1">
            <input type="number" placeholder="Segundo Numero" id="numero2">
        </div>
        <div id="botao">
            <input type="submit" value="+" id="somar" onclick="somar()">
            <input type="submit" value="-" id="subtrair" onclick="subtrair()">
            <input type="submit" value="x" id="multiplicar" onclick="multiplicar()">
            <input type="submit" value="&#247" id="dividir"onclick="dividir()">
        </div>
        <div>
            <p id="resultado">Resultado:</p>
        </div>
    </div>
</body>
<script src="index.js"></script>
</html>
